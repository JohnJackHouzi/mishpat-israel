services:
  mishpat:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MISHPAT_RATE_PER_MIN: "60"
      MISHPAT_ALLOWED_HOSTS: ${MISHPAT_ALLOWED_HOSTS:-}
      MISHPAT_AUTO_UPDATE: ${MISHPAT_AUTO_UPDATE:-1}
    volumes:
      - ${MISHPAT_VOLUME:-mishpat-data}:/data
volumes:
  mishpat-data:
